<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>SpaceHub</title>
<style>
:root{color-scheme:dark;--bg:#070b18;--panel:#11182b;--muted:#9aa8c5;--text:#f4f7ff;--accent:#a9b8ff;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{background:radial-gradient(ellipse at 76% 14%,rgba(73,88,175,.23),transparent 32%),radial-gradient(ellipse at 8% 88%,rgba(42,79,130,.16),transparent 35%),#070b18}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;background-image:radial-gradient(1px 1px at 13% 21%,#fff 99%,transparent),radial-gradient(1px 1px at 67% 34%,#fff 99%,transparent),radial-gradient(2px 2px at 88% 72%,#fff 99%,transparent),radial-gradient(1px 1px at 43% 83%,#fff 99%,transparent),radial-gradient(1px 1px at 26% 64%,#fff 99%,transparent);background-size:310px 260px}
.shell{position:relative;z-index:1;width:100%;height:100%;padding:4.5vh 5.3vw 3.5vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:14px}.logo{width:42px;height:42px;border:1px solid #7184db;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#29365f,#121a32);font-size:22px;box-shadow:0 0 28px #6678d526}.brand h1{font-size:25px;letter-spacing:.4px;margin:0;font-weight:700}.brand h1 span{color:var(--accent)}.tag{color:var(--muted);font-size:12px;letter-spacing:2px;margin-top:5px}
.status{display:flex;align-items:center;gap:18px;color:#d9e1f8;font-size:15px}.status .date{color:var(--muted)}.status .dot{width:7px;height:7px;background:#8de1b0;border-radius:50%;display:inline-block;margin-right:7px;box-shadow:0 0 10px #8de1b077}
.hero{margin-top:6.4vh;margin-bottom:4vh;display:flex;justify-content:space-between;align-items:end}.eyebrow{font-size:12px;letter-spacing:2.5px;color:var(--accent);font-weight:bold}.hero h2{font-size:clamp(32px,4.2vw,57px);letter-spacing:-1.7px;line-height:1.04;margin:12px 0 10px}.hero p{margin:0;color:var(--muted);font-size:17px}.clock{font-size:clamp(30px,3.4vw,45px);font-weight:300;letter-spacing:1px;font-variant-numeric:tabular-nums;text-align:right}.clock-label{color:var(--muted);font-size:12px;text-align:right;margin-top:6px;letter-spacing:1.5px}
.section-label{font-size:11px;letter-spacing:2px;color:#8795b5;margin-bottom:15px}.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}.tile{position:relative;min-height:clamp(135px,18vh,180px);border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(24,33,57,.94),rgba(13,19,36,.94));padding:22px 20px;text-align:left;color:var(--text);font:inherit;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:transform .18s,border-color .18s,background .18s,box-shadow .18s;outline:none}.tile:hover,.tile:focus-visible,.tile.selected{transform:translateY(-5px) scale(1.025);border-color:#aab8ff;background:linear-gradient(145deg,rgba(44,56,94,.98),rgba(20,28,52,.98));box-shadow:0 12px 34px #0005,0 0 0 2px #9eafff22}.tile:focus-visible:after,.tile.selected:after{content:"";position:absolute;inset:-4px;border:2px solid #9eafff;border-radius:23px;pointer-events:none}.tile-icon{width:49px;height:49px;border-radius:15px;background:rgba(158,176,255,.1);display:grid;place-items:center;font-size:25px}.tile-name{font-size:19px;font-weight:700;margin-top:18px}.tile-sub{font-size:12px;color:var(--muted);margin-top:6px}.footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;color:#7f8ba7;font-size:12px;padding-top:25px}.keys{display:flex;gap:17px}.key{display:flex;align-items:center;gap:7px}.kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;border:1px solid #45506b;border-radius:6px;padding:0 5px;color:#d9e2ff;font-size:11px}
.overlay{position:fixed;inset:0;z-index:5;background:#030611b8;display:none;align-items:center;justify-content:center;padding:5vw;backdrop-filter:blur(10px)}.overlay.open{display:flex}.dialog{width:min(760px,90vw);min-height:300px;border:1px solid #6576b1;border-radius:25px;padding:34px;background:linear-gradient(145deg,#17213c,#0d1325);box-shadow:0 30px 100px #0009}.dialog-top{display:flex;justify-content:space-between;align-items:center}.dialog h3{font-size:32px;margin:20px 0 10px}.dialog p{color:var(--muted);font-size:16px;line-height:1.6}.dialog-actions{display:flex;gap:12px;margin-top:28px}.action{border:1px solid #53638e;border-radius:12px;padding:13px 18px;background:#202c4b;color:white;font-size:15px}.action:focus,.action:hover{outline:2px solid #a9b8ff}.tiny{font-size:11px;letter-spacing:1.5px;color:var(--accent)}#toast{position:fixed;left:50%;bottom:8vh;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#202b49;border:1px solid #6678ae;padding:13px 20px;border-radius:12px;color:white;z-index:10}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.shell{padding:3vh 4vw}.hero{margin-top:4vh}.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{min-height:130px;padding:16px}.tile-icon{width:40px;height:40px}.tile-name{font-size:16px}.tile-sub{font-size:11px}.hero p{font-size:14px}.status .date{display:none}}
@media(max-height:650px){.hero{margin-top:3vh;margin-bottom:2.5vh}.tile{min-height:120px}.shell{padding-top:3vh}.hero h2{font-size:38px}}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="brand"><div class="logo" aria-hidden="true">✦</div><div><h1>Space<span>Hub</span></h1><div class="tag">YOUR SPACE. ONE PLACE.</div></div></div>
  <div class="status"><span><i class="dot"></i>READY</span><span class="date" id="date">--</span></div>
</header>
<section class="hero">
  <div><div class="eyebrow">WELCOME BACK</div><h2>Her şey tek<br>bir yerde.</h2><p>Alanını seç, keşfe başla.</p></div>
  <div><div class="clock" id="clock">00:00</div><div class="clock-label">LOCAL TIME</div></div>
</section>
<div class="section-label">EXPLORE SPACEHUB&nbsp; / &nbsp;01—05</div>
<main class="tiles" id="tiles" aria-label="SpaceHub menüsü">
  <button class="tile selected" data-id="media"><div class="tile-icon">▶</div><div><div class="tile-name">Media</div><div class="tile-sub">İzle ve dinle</div></div></button>
  <button class="tile" data-id="apps"><div class="tile-icon">▦</div><div><div class="tile-name">Apps</div><div class="tile-sub">Uygulamalar</div></div></button>
  <button class="tile" data-id="weather"><div class="tile-icon">☼</div><div><div class="tile-name">Weather</div><div class="tile-sub">Hava durumu</div></div></button>
  <button class="tile" data-id="clock"><div class="tile-icon">◷</div><div><div class="tile-name">Clock</div><div class="tile-sub">Saat ve zamanlayıcı</div></div></button>
  <button class="tile" data-id="settings"><div class="tile-icon">⚙</div><div><div class="tile-name">Settings</div><div class="tile-sub">SpaceHub ayarları</div></div></button>
</main>
<footer><span>SPACEHUB <span style="color:#526080">·</span> EARLY ACCESS</span><div class="keys"><span class="key"><span class="kbd">← ↑ ↓ →</span> Navigate</span><span class="key"><span class="kbd">OK</span> Select</span><span class="key"><span class="kbd">BACK</span> Close</span></div></footer>
</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
 <div class="dialog"><div class="dialog-top"><span class="tiny">SPACEHUB / <span id="dialogIndex">01</span></span><span class="tiny">PREVIEW</span></div><h3 id="dialogTitle">Media</h3><p id="dialogText"></p><div class="dialog-actions"><button class="action" id="primaryAction">Devam et</button><button class="action" id="closeAction">Menüye dön</button></div></div>
</div>
<div id="toast" role="status"></div>
<script>
(function(){
 const tiles=Array.from(document.querySelectorAll('.tile'));
 const overlay=document.getElementById('overlay');
 const title=document.getElementById('dialogTitle');
 const text=document.getElementById('dialogText');
 const index=document.getElementById('dialogIndex');
 const primary=document.getElementById('primaryAction');
 const close=document.getElementById('closeAction');
 let selected=0, previousFocus=tiles[0];
 const details={
  media:{title:'Media',index:'01',text:'Video ve müzik deneyimini tek ekranda toplamak için başlangıç alanı. Bu ilk sürümde gerçek medya servisleri henüz bağlanmadı.',action:'Tamam'},
  apps:{title:'Apps',index:'02',text:'Sık kullandığın uygulamalar için bir merkez. TV uygulamalarını doğrudan açma desteği, televizyon modeli ve Tizen izinlerine göre sonraki aşamada eklenecek.',action:'Anladım'},
  weather:{title:'Weather',index:'03',text:'Hava durumu kartı hazır. Canlı hava verisi göstermek için sonraki sürümde bir hava durumu kaynağı bağlanacak.',action:'Tamam'},
  clock:{title:'Clock',index:'04',text:'Saat ve tarih ana ekranda canlı güncelleniyor. Şu an yerel saatini kullanıyor; alarm ve zamanlayıcı özellikleri henüz eklenmedi.',action:'Tamam'},
  settings:{title:'Settings',index:'05',text:'SpaceHub arayüz önizlemesi. Bu sürümde kalıcı ayar kaydı yok; TV kumandasıyla gezinme ve menü kullanımı aktif.',action:'Anladım'}
 };
 function updateClock(){
  const now=new Date();
  document.getElementById('clock').textContent=now.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('date').textContent=now.toLocaleDateString('tr-TR',{weekday:'short',day:'numeric',month:'short'});
 }
 function select(i,focus){selected=(i+tiles.length)%tiles.length;tiles.forEach((t,n)=>{t.classList.toggle('selected',n===selected);t.setAttribute('aria-pressed',n===selected?'true':'false')});if(focus)tiles[selected].focus();}
 function openPanel(id){const d=details[id];if(!d)return;previousFocus=document.activeElement;title.textContent=d.title;text.textContent=d.text;index.textContent=d.index;primary.textContent=d.action;overlay.classList.add('open');close.focus();}
 function closePanel(){overlay.classList.remove('open');if(previousFocus&&previousFocus.focus)previousFocus.focus();}
 tiles.forEach((tile,i)=>{tile.addEventListener('focus',()=>select(i,false));tile.addEventListener('click',()=>openPanel(tile.dataset.id));});
 close.addEventListener('click',closePanel);primary.addEventListener('click',closePanel);
 overlay.addEventListener('click',e=>{if(e.target===overlay)closePanel()});
 document.addEventListener('keydown',e=>{
  if(overlay.classList.contains('open')){if(e.key==='Escape'||e.key==='Backspace'||e.key==='BrowserBack'){e.preventDefault();closePanel();}else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();(document.activeElement===primary?close:primary).focus();}return;}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();let next=selected;if(e.key==='ArrowRight')next=selected+1;else if(e.key==='ArrowLeft')next=selected-1;else if(e.key==='ArrowDown')next=selected+Math.ceil(tiles.length/5);else if(e.key==='ArrowUp')next=selected-Math.ceil(tiles.length/5);select(next,true);}
  else if(e.key==='Enter'||e.key===' '){if(document.activeElement.classList.contains('tile')){e.preventDefault();document.activeElement.click();}}
  else if(e.key==='Escape'||e.key==='Backspace'||e.key==='BrowserBack'){showToast('SpaceHub ana ekranı');}
 });
 function showToast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700);}
 updateClock();setInterval(updateClock,1000);select(0,false);
})();
</script>
</body>
</html>
